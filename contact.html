<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XPRCORE – Contact</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    background-color: #f9f9f9;
    color: #333;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  /* HEADER */
  header {
    background-color: #fff;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: auto;
    padding: 15px 20px;
  }
  nav h1 { font-size: 1.8rem; color: #0077cc; }
  nav ul { list-style: none; display: flex; gap: 20px; }
  nav li a { font-weight: bold; color: #333; transition: color 0.3s; }
  nav li a:hover { color: #0077cc; }
  .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; }
  @media(max-width:768px){
    nav ul { display: none; flex-direction: column; gap: 10px; width: 100%; background: #fff; position: absolute; top: 60px; left: 0; border-top: 1px solid #ddd; }
    nav ul.active { display: flex; }
    .menu-toggle { display: block; color: #0077cc; }
  }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
  }
  section {
    max-width: 500px;
    width: 100%;
    text-align: center;
  }
  h2.section-title { font-size: 2rem; margin-bottom: 20px; color: #0077cc; }
  p { margin-bottom: 40px; }

  form {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
  }
  button {
    background-color: #0077cc;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }
  button:hover { background-color: #005fa3; }

  /* FOOTER */
  footer {
    background-color: #fff;
    border-top: 1px solid #ddd;
    text-align: center;
    padding: 30px 20px;
  }
  .social { margin-top: 10px; }
  .social a { margin: 0 10px; font-weight: bold; color: #0077cc; }


/* XPRCORE DARK DASHBOARD THEME */
:root{
--bg:#03142e;--bg2:#061d3f;--panel:#082650;--panel2:#0b2d5d;
--border:rgba(91,169,248,.18);--border-strong:rgba(91,169,248,.30);
--text:#f4f8ff;--muted:#8fa9c7;--blue:#5aa9f8;--blue2:#2f80ed;
--purple:#7b2cff;--green:#42e8a0;--yellow:#ffd166;--red:#ff6374;
--shadow:0 18px 55px rgba(0,0,0,.28);
}
html{scroll-behavior:smooth}
body{
margin:0;min-height:100vh;color:var(--text);
font-family:Arial,Helvetica,sans-serif;line-height:1.6;
background:radial-gradient(circle at 8% 0%,rgba(65,145,255,.18),transparent 30%),
radial-gradient(circle at 92% 0%,rgba(124,44,255,.18),transparent 30%),
linear-gradient(180deg,#03142e 0%,#041a38 52%,#020e21 100%);
background-attachment:fixed;
}
a{color:inherit}
header{
background:rgba(3,20,46,.82)!important;border-bottom:1px solid var(--border)!important;
position:sticky;top:0;z-index:1000;backdrop-filter:blur(14px);
box-shadow:0 8px 30px rgba(0,0,0,.16);
}
nav{
display:flex;justify-content:space-between;align-items:center;gap:20px;
max-width:1450px!important;margin:auto;padding:16px 20px!important;
}
nav h1{
font-size:21px!important;letter-spacing:.1px;color:var(--text)!important;
text-shadow:0 0 22px rgba(90,169,248,.16);
}
nav ul{list-style:none;display:flex;gap:8px!important;align-items:center}
nav li a{
display:block;padding:9px 12px;border:1px solid transparent;border-radius:10px;
font-weight:800!important;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
color:#a9bfd8!important;transition:.18s ease;
}
nav li a:hover{
color:#fff!important;border-color:rgba(90,169,248,.35);
background:rgba(25,67,112,.55);transform:translateY(-1px);
}
.menu-toggle{display:none;font-size:1.4rem;cursor:pointer;color:var(--blue)!important}
main{max-width:1450px!important;margin:auto;padding:34px 20px 50px!important}
section{margin-bottom:38px}
h2.section-title{
font-size:18px!important;margin-bottom:20px;color:var(--text)!important;
text-align:left!important;letter-spacing:.01em;
}
p{color:#d9e6f5}
.feature-card,.node-spec,form{
background:linear-gradient(180deg,rgba(8,38,80,.94),rgba(4,24,52,.97))!important;
border:1px solid var(--border)!important;border-radius:18px!important;
box-shadow:var(--shadow)!important;color:var(--text);
backdrop-filter:blur(12px);
}
.feature-card{padding:22px!important}
.feature-card:hover{transform:translateY(-2px)!important;box-shadow:0 20px 50px rgba(0,0,0,.28)!important;border-color:var(--border-strong)!important}
.feature-card i{color:var(--blue)!important}
.node-spec{padding:22px!important}
footer{
background:rgba(3,14,33,.78)!important;border-top:1px solid var(--border)!important;
text-align:center;padding:28px 20px!important;color:var(--muted);
}
footer p{color:var(--muted)}
.social a{color:var(--blue)!important}
.social a:hover{color:#fff!important}
input,textarea{
background:rgba(2,17,36,.55)!important;color:var(--text)!important;
border:1px solid rgba(90,169,248,.20)!important;border-radius:10px!important;
outline:none;
}
input:focus,textarea:focus{border-color:rgba(90,169,248,.65)!important;box-shadow:0 0 0 3px rgba(90,169,248,.08)}
button{
background:linear-gradient(135deg,var(--blue2),var(--purple))!important;
color:#fff!important;border-radius:10px!important;
box-shadow:0 8px 25px rgba(77,105,255,.20);
}
.hero{
background:radial-gradient(circle at 50% 0%,rgba(65,145,255,.18),transparent 45%),
linear-gradient(180deg,rgba(6,29,63,.9),rgba(3,20,46,.25))!important;
color:var(--text)!important;border-bottom:1px solid rgba(91,169,248,.10);
padding:72px 20px 90px!important;
}
.hero h2,.hero p{color:var(--text)!important}
.hero a.button{
background:linear-gradient(135deg,var(--blue2),var(--purple))!important;
color:#fff!important;border:1px solid rgba(255,255,255,.08);border-radius:10px!important;
box-shadow:0 8px 25px rgba(77,105,255,.20);
}
.hero a.button:hover{background:linear-gradient(135deg,#4292ff,#8b4cff)!important;color:#fff!important}
li{color:#d9e6f5}
@media(max-width:768px){
nav{position:relative}
nav ul{
display:none!important;flex-direction:column;gap:5px!important;width:100%;
background:rgba(3,20,46,.97)!important;position:absolute;top:100%;left:0;
padding:12px!important;border-top:1px solid var(--border)!important;
box-shadow:0 18px 35px rgba(0,0,0,.3);
}
nav ul.active{display:flex!important}
nav li{width:100%}
nav li a{width:100%;padding:12px}
.menu-toggle{display:block!important}
main{padding:28px 14px 40px!important}
.hero{padding:55px 14px 70px!important}
}


  /* Modern navigation */
  header {
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  nav {
    position: relative;
  }

  nav ul {
    align-items: center;
  }

  nav li a {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 38px;
    padding: 7px 12px;
    border-radius: 10px;
    transition: color .25s ease, background .25s ease, transform .25s ease;
  }

  nav li a:hover {
    background: rgba(77, 226, 255, .08);
    transform: translateY(-1px);
  }

  .menu-toggle {
    width: 42px;
    height: 42px;
    border: 1px solid rgba(77,226,255,.20);
    border-radius: 12px;
    background: rgba(10, 18, 35, .72);
    color: #4de2ff !important;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    transition: transform .25s ease, border-color .25s ease, background .25s ease;
  }

  .menu-toggle:hover {
    transform: translateY(-1px);
    border-color: rgba(77,226,255,.45);
    background: rgba(77,226,255,.10);
  }

  @media(max-width:768px){
    nav {
      min-height: 70px;
    }

    .menu-toggle {
      display: inline-flex;
      position: relative;
      z-index: 1101;
    }

    nav ul {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      position: absolute;
      top: calc(100% + 10px);
      left: 15px;
      right: 15px;
      width: auto;
      padding: 10px;
      margin: 0;
      border: 1px solid rgba(77,226,255,.16);
      border-radius: 16px;
      background: rgba(8, 14, 28, .96);
      box-shadow: 0 18px 50px rgba(0,0,0,.42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.98);
      transform-origin: top right;
      transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
      z-index: 1100;
    }

    nav ul.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    nav li a {
      width: 100%;
      justify-content: flex-start;
      padding: 12px 14px;
      min-height: 44px;
      border-radius: 10px;
    }

    nav li a:hover {
      transform: none;
    }
  }


  .menu-toggle.is-open {
    transform: rotate(90deg);
    border-color: rgba(77,226,255,.45);
    background: rgba(77,226,255,.10);
  }
  @media(max-width:768px){
    .menu-toggle.is-open { transform: rotate(90deg); }
  }
</style>
</head>
<body>
<header>
  <nav>
    <h1>XPRCORE</h1>
    <i class="fas fa-bars menu-toggle"></i>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="https://www.xprcore.com/analysis">XPR Analysis</a></li>
      <li><a href="xprnetwork.html">XPR Network</a></li>
      <li><a href="vision.html">Vision</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section>
    <h2 class="section-title">Contact Us</h2>
    <p>Have questions or want to get in touch? Fill out the form below and we'll respond as soon as possible.</p>
    <form action="mailto:xprcore@gmail.com" method="post" enctype="text/plain">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>
</main>

<footer>
  <p>© XPRCORE. All rights reserved.</p>
  <div class="social">
    <a href="https://t.me/xprcore"><i class="fab fa-telegram"></i> Telegram</a>
    <a href="https://x.com/xprcore"><i class="fab fa-x-twitter"></i></a>
    <a href="mailto:xprcore@gmail.com"><i class="fas fa-envelope"></i> Email</a>
  </div>
</footer>

<script>
const toggle = document.querySelector('.menu-toggle');
const menu = document.querySelector('nav ul');

toggle.setAttribute('aria-label', 'Open menu');
toggle.setAttribute('aria-expanded', 'false');

toggle.addEventListener('click', () => {
  const isOpen = menu.classList.toggle('active');
  toggle.setAttribute('aria-expanded', String(isOpen));
  toggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
  toggle.classList.toggle('is-open', isOpen);
});

menu.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    menu.classList.remove('active');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Open menu');
    toggle.classList.remove('is-open');
  });
});
</script>
</body>
</html>
