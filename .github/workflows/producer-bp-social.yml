name: Update producer BP social profiles

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: producer-bp-social
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect producer BP social profiles
        run: node scripts/collect-producer-bp-social.mjs

      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/producer-bp-social.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update producer BP social profiles'
          git push
