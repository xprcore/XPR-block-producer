name: Collect producer social activity

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: producer-social-activity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect social activity
        run: node scripts/collect-producer-social-activity.mjs

      - name: Commit activity data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/producer-social-activity.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update producer social activity'
          git push
